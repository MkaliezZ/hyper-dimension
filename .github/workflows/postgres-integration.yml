name: Python and PostgreSQL integration

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      HD_TEST_PG_DSN: postgresql://hd_test:hd_test_only@127.0.0.1:5432/hd_test
    steps:
      - uses: actions/checkout@v4
      - name: Start PostgreSQL 17 with official registry fallback
        run: bash .github/scripts/start-test-postgres.sh
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project and test dependencies
        run: python -m pip install -e '.[dev,mcp,a2a,database,pdf]'
      - name: Run all tests with PostgreSQL
        run: python -m pytest -q
      - name: PostgreSQL diagnostics
        if: failure()
        run: docker logs --tail 100 hd-ci-postgres || true
      - name: Stop test database
        if: always()
        run: docker rm --force hd-ci-postgres || true
