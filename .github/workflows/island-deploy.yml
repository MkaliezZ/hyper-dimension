name: Pending steward backdrop candidate (diagnostic only)
'on':
  workflow_dispatch:
    inputs:
      check_scope:
        description: Original resident and production flows; not release acceptance
        type: choice
        default: allocation-candidate
        options:
        - allocation-candidate
permissions:
  contents: read
concurrency:
  group: pending-steward-backdrop-${{ github.ref }}
  cancel-in-progress: false
jobs:
  resident:
    name: Windows original resident flow with allocation and pending-backdrop candidate
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        working-directory: island
        shell: bash
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '24'
    - name: Install isolated browser dependencies
      run: npm ci --ignore-scripts --registry=https://registry.npmjs.org
    - name: Verify original test and reviewed candidate; prepare diagnostics
      run: "mkdir -p qa/resident-registration-trace\ncat > qa/resident-registration-trace/preload.mjs <<'TRACE_JS'\nimport\
        \ {mkdir,appendFile,writeFile} from 'node:fs/promises';\nimport {writeFileSync} from 'node:fs';\nimport {resolve,join}\
        \ from 'node:path';\nimport {createRequire} from 'node:module';\nimport {monitorEventLoopDelay,performance} from 'node:perf_hooks';\n\
        \n// Diagnostic only: the original test, timing gates and inputs are\n// unchanged. Only this invocation's owned browser\
        \ pages are profiled.\nconst directory=resolve('qa/resident-registration-trace');\nawait mkdir(directory,{recursive:true});\n\
        const histogram=monitorEventLoopDelay({resolution:20});histogram.enable();\nlet previous=performance.eventLoopUtilization(),last=performance.now();\n\
        const summary={diagnosticOnly:true,acceptanceClaimed:false,candidateOnlyConnectivityAllocationChanged:true,\n  startedAt:new\
        \ Date().toISOString(),pid:process.pid,pageProfiles:[],errors:[]};\nconst timer=setInterval(()=>{\n const now=performance.now(),utilization=performance.eventLoopUtilization(previous);\n\
        \ previous=performance.eventLoopUtilization();\n const row={at:new Date().toISOString(),elapsedMs:now-last,eventLoopUtilization:utilization.utilization,\n\
        \   eventLoopMeanMs:Number.isFinite(histogram.mean)?histogram.mean/1e6:null,eventLoopMaxMs:histogram.max/1e6,\n  \
        \ memory:process.memoryUsage(),cpu:process.cpuUsage()};last=now;histogram.reset();\n void appendFile(join(directory,'node-event-loop.ndjson'),JSON.stringify(row)+'\\\
        n').catch(e=>summary.errors.push(e.message));\n},1000);timer.unref();\nconst {chromium}=createRequire(resolve('package.json'))('playwright-core');\n\
        const launch=chromium.launch.bind(chromium);let contexts=0,pages=0;\nchromium.launch=async(...args)=>{\n const browser=await\
        \ launch(...args),newContext=browser.newContext.bind(browser);\n browser.newContext=async(...contextArgs)=>{\n  const\
        \ context=await newContext(...contextArgs),contextId=++contexts,owned=[];\n  const newPage=context.newPage.bind(context),close=context.close.bind(context);\n\
        \  context.newPage=async(...pageArgs)=>{\n   const page=await newPage(...pageArgs),pageId=++pages,row={contextId,pageId,startedAt:new\
        \ Date().toISOString()};\n   summary.pageProfiles.push(row);\n   try{\n    const session=await context.newCDPSession(page);await\
        \ session.send('Profiler.enable');\n    await session.send('Profiler.setSamplingInterval',{interval:1000});await session.send('Profiler.start');\n\
        \    let finished=false;\n    owned.push(async()=>{\n     if(finished)return;finished=true;\n     try{const {profile}=await\
        \ session.send('Profiler.stop');const name='owned-page-'+pageId+'.cpuprofile';\n      await writeFile(join(directory,name),JSON.stringify(profile));row.file=name;row.samples=profile.samples?.length??0;\n\
        \      row.finishedAt=new Date().toISOString();await session.detach();}\n     catch(error){row.error=String(error.message).slice(0,400);}\n\
        \    });\n   }catch(error){row.error=String(error.message).slice(0,400);}\n   return page;\n  };\n  context.close=async(...closeArgs)=>{await\
        \ Promise.allSettled(owned.map(stop=>stop()));return close(...closeArgs);};\n  return context;\n };\n return browser;\n\
        };\nprocess.on('exit',()=>{clearInterval(timer);histogram.disable();summary.finishedAt=new Date().toISOString();\n\
        \ try{writeFileSync(join(directory,'instrumentation-summary.json'),JSON.stringify(summary,null,2));}catch{}});\n\n\
        // The candidate changes only allocation inside the same full connectivity search.\n\nTRACE_JS\nnode --input-type=module\
        \ - <<'JS'\nimport {readFileSync,writeFileSync} from 'node:fs';\nimport {createHash} from 'node:crypto';\nimport assert\
        \ from 'node:assert/strict';\nconst sha=file=>createHash('sha256').update(readFileSync(file)).digest('hex');\nassert.equal(sha('tests/v213-task-chain-browser.mjs'),'9c8a3fbe71c0222da9b862308778ee185b3911dc388292955ae7282508062071');\n\
        assert.equal(sha('src/placements.js'),'3b046e32e57116f49a8667c335760c39bb535fede9603056e72e934562bb3c61');\nwriteFileSync('qa/resident-registration-trace/source-contract.json',JSON.stringify({base:'4fe21e0c075969bbac81bbd229ab0d91f20e67da',candidatePlacementsSha256:'3b046e32e57116f49a8667c335760c39bb535fede9603056e72e934562bb3c61',originalTest:'v213-task-chain-browser.mjs',originalTestSha256:'9c8a3fbe71c0222da9b862308778ee185b3911dc388292955ae7282508062071',assertionsClocksAndDeadlinesUnchanged:true,diagnosticOnly:true,notReleaseManifestQualification:true}));\n\
        JS\n\nnode --input-type=module - <<'JS'\nimport {readFileSync} from 'node:fs';\nimport {createHash} from 'node:crypto';\n\
        import assert from 'node:assert/strict';\nassert.equal(createHash('sha256').update(readFileSync(\"src/app.js\")).digest('hex'),\"\
        f472d6f3d64677f54a0ea0ec95991bd6ebf38dfd049077e2cfcad348a7d5b100\");\nassert.equal(createHash('sha256').update(readFileSync(\"\
        tests/v357-steward-backdrop-browser.mjs\")).digest('hex'),\"86b3d55406b496a2fc56d278e95222dd910a78d350e466b3dd73867d96769388\"\
        );\nJS\n"
    - name: Original resident assertions and deadlines with CPU and IO observations
      env:
        HD_QA_OUT: qa/resident-registration-trace/native-resident
        HD_QA_WORK_JOURNAL: '1'
      run: node --cpu-prof --cpu-prof-dir=qa/resident-registration-trace --cpu-prof-interval=1000 --trace-events-enabled --trace-event-categories=v8,node.fs.async,node.fs.sync,node.perf
        '--trace-event-file-pattern=qa/resident-registration-trace/node-trace-${pid}.json' --import ./qa/resident-registration-trace/preload.mjs
        tests/v213-task-chain-browser.mjs
    - name: Retain isolated diagnostic evidence
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: steward-backdrop-candidate-resident-windows
        path: island/qa/resident-registration-trace/
        if-no-files-found: error
        retention-days: 3
  production:
    name: Windows original production flow with allocation and pending-backdrop candidate
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        working-directory: island
        shell: bash
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '24'
    - name: Install isolated browser dependencies
      run: npm ci --ignore-scripts --registry=https://registry.npmjs.org
    - name: Verify original test and reviewed candidate; prepare diagnostics
      run: "mkdir -p qa/resident-registration-trace\ncat > qa/resident-registration-trace/preload.mjs <<'TRACE_JS'\nimport\
        \ {mkdir,appendFile,writeFile} from 'node:fs/promises';\nimport {writeFileSync} from 'node:fs';\nimport {resolve,join}\
        \ from 'node:path';\nimport {createRequire} from 'node:module';\nimport {monitorEventLoopDelay,performance} from 'node:perf_hooks';\n\
        \n// Diagnostic only: the original test, timing gates and inputs are\n// unchanged. Only this invocation's owned browser\
        \ pages are profiled.\nconst directory=resolve('qa/resident-registration-trace');\nawait mkdir(directory,{recursive:true});\n\
        const histogram=monitorEventLoopDelay({resolution:20});histogram.enable();\nlet previous=performance.eventLoopUtilization(),last=performance.now();\n\
        const summary={diagnosticOnly:true,acceptanceClaimed:false,candidateOnlyConnectivityAllocationChanged:true,\n  startedAt:new\
        \ Date().toISOString(),pid:process.pid,pageProfiles:[],errors:[]};\nconst timer=setInterval(()=>{\n const now=performance.now(),utilization=performance.eventLoopUtilization(previous);\n\
        \ previous=performance.eventLoopUtilization();\n const row={at:new Date().toISOString(),elapsedMs:now-last,eventLoopUtilization:utilization.utilization,\n\
        \   eventLoopMeanMs:Number.isFinite(histogram.mean)?histogram.mean/1e6:null,eventLoopMaxMs:histogram.max/1e6,\n  \
        \ memory:process.memoryUsage(),cpu:process.cpuUsage()};last=now;histogram.reset();\n void appendFile(join(directory,'node-event-loop.ndjson'),JSON.stringify(row)+'\\\
        n').catch(e=>summary.errors.push(e.message));\n},1000);timer.unref();\nconst {chromium}=createRequire(resolve('package.json'))('playwright-core');\n\
        const launch=chromium.launch.bind(chromium);let contexts=0,pages=0;\nchromium.launch=async(...args)=>{\n const browser=await\
        \ launch(...args),newContext=browser.newContext.bind(browser);\n browser.newContext=async(...contextArgs)=>{\n  const\
        \ context=await newContext(...contextArgs),contextId=++contexts,owned=[];\n  const newPage=context.newPage.bind(context),close=context.close.bind(context);\n\
        \  context.newPage=async(...pageArgs)=>{\n   const page=await newPage(...pageArgs),pageId=++pages,row={contextId,pageId,startedAt:new\
        \ Date().toISOString()};\n   summary.pageProfiles.push(row);\n   try{\n    const session=await context.newCDPSession(page);await\
        \ session.send('Profiler.enable');\n    await session.send('Profiler.setSamplingInterval',{interval:1000});await session.send('Profiler.start');\n\
        \    let finished=false;\n    owned.push(async()=>{\n     if(finished)return;finished=true;\n     try{const {profile}=await\
        \ session.send('Profiler.stop');const name='owned-page-'+pageId+'.cpuprofile';\n      await writeFile(join(directory,name),JSON.stringify(profile));row.file=name;row.samples=profile.samples?.length??0;\n\
        \      row.finishedAt=new Date().toISOString();await session.detach();}\n     catch(error){row.error=String(error.message).slice(0,400);}\n\
        \    });\n   }catch(error){row.error=String(error.message).slice(0,400);}\n   return page;\n  };\n  context.close=async(...closeArgs)=>{await\
        \ Promise.allSettled(owned.map(stop=>stop()));return close(...closeArgs);};\n  return context;\n };\n return browser;\n\
        };\nprocess.on('exit',()=>{clearInterval(timer);histogram.disable();summary.finishedAt=new Date().toISOString();\n\
        \ try{writeFileSync(join(directory,'instrumentation-summary.json'),JSON.stringify(summary,null,2));}catch{}});\n\n\
        // The candidate changes only allocation inside the same full connectivity search.\n\nTRACE_JS\nnode --input-type=module\
        \ - <<'JS'\nimport {readFileSync,writeFileSync} from 'node:fs';\nimport {createHash} from 'node:crypto';\nimport assert\
        \ from 'node:assert/strict';\nconst sha=file=>createHash('sha256').update(readFileSync(file)).digest('hex');\nassert.equal(sha('tests/v228-custom-shops-browser.mjs'),'63f430cf6b0be8867250ad35a762e5a0397d77ab8d3f907e2bc0a32e02009390');\n\
        assert.equal(sha('src/placements.js'),'3b046e32e57116f49a8667c335760c39bb535fede9603056e72e934562bb3c61');\nwriteFileSync('qa/resident-registration-trace/source-contract.json',JSON.stringify({base:'4fe21e0c075969bbac81bbd229ab0d91f20e67da',candidatePlacementsSha256:'3b046e32e57116f49a8667c335760c39bb535fede9603056e72e934562bb3c61',originalTest:'v228-custom-shops-browser.mjs',originalTestSha256:'63f430cf6b0be8867250ad35a762e5a0397d77ab8d3f907e2bc0a32e02009390',assertionsClocksAndDeadlinesUnchanged:true,diagnosticOnly:true,notReleaseManifestQualification:true}));\n\
        JS\n\nnode --input-type=module - <<'JS'\nimport {readFileSync} from 'node:fs';\nimport {createHash} from 'node:crypto';\n\
        import assert from 'node:assert/strict';\nassert.equal(createHash('sha256').update(readFileSync(\"src/app.js\")).digest('hex'),\"\
        f472d6f3d64677f54a0ea0ec95991bd6ebf38dfd049077e2cfcad348a7d5b100\");\nassert.equal(createHash('sha256').update(readFileSync(\"\
        tests/v357-steward-backdrop-browser.mjs\")).digest('hex'),\"86b3d55406b496a2fc56d278e95222dd910a78d350e466b3dd73867d96769388\"\
        );\nJS\n"
    - name: Original production assertions and deadlines with CPU and IO observations
      env:
        HD_QA_OUT: qa/resident-registration-trace/native-production
        HD_QA_WORK_JOURNAL: '1'
        HD_QA_SHELF_FROM_PRODUCTION: '1'
      run: node --cpu-prof --cpu-prof-dir=qa/resident-registration-trace --cpu-prof-interval=1000 --trace-events-enabled --trace-event-categories=v8,node.fs.async,node.fs.sync,node.perf
        '--trace-event-file-pattern=qa/resident-registration-trace/node-trace-${pid}.json' --import ./qa/resident-registration-trace/preload.mjs
        tests/v228-custom-shops-browser.mjs
    - name: Retain isolated diagnostic evidence
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
