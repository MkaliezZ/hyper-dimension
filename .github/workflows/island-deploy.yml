{
  "name": "Recovery input diagnostics (V358 baseline)",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "check_scope": {
          "type": "choice",
          "default": "recovery-input-diagnostic",
          "options": [
            "recovery-input-diagnostic"
          ]
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "recovery-input-readonly-${{ github.ref }}",
    "cancel-in-progress": false
  },
  "jobs": {
    "diagnostic": {
      "name": "macos-15-intel / original recovery timing with readonly observations",
      "runs-on": "macos-15-intel",
      "timeout-minutes": 15,
      "defaults": {
        "run": {
          "working-directory": "island",
          "shell": "bash"
        }
      },
      "steps": [
        {
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262"
        },
        {
          "uses": "actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020",
          "with": {
            "node-version": "24"
          }
        },
        {
          "name": "Install original isolated browser dependencies",
          "run": "npm ci --ignore-scripts --registry=https://registry.npmjs.org"
        },
        {
          "name": "Original modal recovery predecessor",
          "run": "node tests/v220-recovery-modal-browser.mjs"
        },
        {
          "name": "Original strict4second background recovery with readonly observations",
          "run": "node tests/v359-recovery-input-diagnostic.mjs"
        },
        {
          "name": "Retain readonly lifecycle and native recovery evidence",
          "if": "always()",
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "with": {
            "name": "v359-mac-recovery-input-diagnostic",
            "path": "island/qa/v359/recovery-input-diagnostic/\nisland/qa/v220/native-recovery-modal/report.json"
          }
        }
      ]
    }
  }
}
