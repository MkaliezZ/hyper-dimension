  native-resident-work:
    if: (inputs.check_scope != 'recovery-input' && inputs.check_scope != 'social-pending' && inputs.check_scope != 'home-journal' && inputs.check_scope != 'frame-recovery') && inputs.check_scope != 'resident-stall'
    name: ${{ matrix.os }} / native resident work
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-14, macos-15-intel]
    runs-on: ${{ matrix.os }}
    # Checkout and the unchanged calendar/visitor budgets must fit the job.
    timeout-minutes: 60
    defaults:
      run:
        working-directory: island
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install isolated browser dependencies
        run: npm ci --ignore-scripts --registry=https://registry.npmjs.org
      - name: Native Windows save lock contention and unique delivery
        if: runner.os == 'Windows'
        run: node tests/v218-save-lock-browser.mjs
      - name: Native durable task recovery after transient I/O replies
        run: node tests/v254-save-io-browser.mjs
        timeout-minutes: 5
      - name: Native sequential resident tasks across fixed work shifts
        env:
          HD_QA_WORK_JOURNAL: "1"
        run: node tests/v213-task-chain-browser.mjs
      - name: Native recruited partner food and task continuation
        run: node tests/v253-partner-self-care-browser.mjs
        timeout-minutes: 8
      - name: Retain native resident work diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-resident-work-${{ matrix.os }}
          path: |
            island/qa/v213/native-task-chains/report.json
            island/qa/v213/native-task-chains/work-progress.json
            island/qa/v213/native-task-chains/*.sample.txt
            island/qa/v213/native-task-chains/*.png
            island/qa/v218/native-save-lock/report.json
            island/qa/v218/native-save-lock/*.png
            island/qa/v253/native-partner-self-care/report.json
            island/qa/v254/native-save-io/report.json
          if-no-files-found: ignore
          retention-days: 3

  native-recovery-input:
