name: Island deployment checks
on:
  workflow_dispatch:
    inputs:
      check_scope:
        description: Full suite, soil, recovery-input or social-pending or home-journal diagnostics
        type: choice
        default: full
        options: [full, soil-diagnostics, recovery-input, social-pending, home-journal, frame-recovery, resident-stall]
  push:
    paths:
      - island/**
      - .github/workflows/island-deploy.yml
  pull_request:
    paths:
      - island/**
      - .github/workflows/island-deploy.yml
permissions:
  contents: read
concurrency:
  group: island-deploy-${{ github.event.pull_request.number || github.ref }}-${{ inputs.check_scope || 'full' }}
  # Preserve running failure diagnostics when a reviewed main fix arrives.
  cancel-in-progress: false
jobs:
  portable-source:
    if: ((github.event_name != 'workflow_dispatch' || (inputs.check_scope != 'soil-diagnostics' && inputs.check_scope != 'recovery-input' && inputs.check_scope != 'social-pending' && inputs.check_scope != 'home-journal')) && (github.event_name != 'workflow_dispatch' || inputs.check_scope != 'frame-recovery')) && inputs.check_scope != 'resident-stall'
    name: ${{ matrix.os }} / Python 3.11
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-14, macos-15-intel]
    runs-on: ${{ matrix.os }}
    # Native rule and interaction limits remain in their tests. Large source-art
    # checkout can take 30 minutes on hosted runners before validation begins.
    timeout-minutes: 60
    defaults:
      run:
        working-directory: island
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify portable source archive parts
        run: python tests/test_source_parts.py -v
      - name: Inspect deployment plan
        run: node tools/agent-deploy.mjs plan
      - name: Verify target platform
        run: node tools/agent-deploy.mjs doctor --python=python
      - name: Rebuild runtime from bundled dependencies
        run: node tools/agent-deploy.mjs setup --python=python --offline
      - name: Verify source and default rules
        run: node tools/agent-deploy.mjs verify
      - name: Verify native steward submission ordering
        run: node tests/v145-steward-preflight-browser.mjs

      - name: Native refresh baseline recovery
        run: node tests/v160-reload-baseline-browser.mjs

      - name: Native map save conflict recovery
        working-directory: island
        run: node tests/v146-map-save-conflict-browser.mjs

      - name: Native expanded geography and shared homes
        run: node tests/v169-geography-browser.mjs

      - name: Native lobby appearance and NPC motion
        run: node --test tests/v148-identity.test.mjs tests/v148-motion.test.mjs tests/v148-travel-schema.test.mjs tests/v152-motion.test.mjs tests/v201-lan-request.test.mjs && node tests/v148-lobby-browser.mjs && node tests/v151-lobby-navigation-browser.mjs && node tests/v171-lobby-motion-browser.mjs

      - name: Native gallery backdrop and resize
        run: node tests/v196-gallery-backdrop-browser.mjs




      - name: Native lobby lost movement receipt
        env:
          HD_MOTION_FAULT: lost
          HD_QA_OUT: qa/v194/movement-lost
        run: node tests/v171-lobby-motion-browser.mjs

      - name: Native low-frame-rate farm navigation
        run: node tests/v173-farm-navigation-browser.mjs

      - name: Native protected checkpoint restart
        run: node tests/v156-checkpoint-restart-browser.mjs


      - name: Print protected checkpoint diagnostics
        if: always()
        run: |
          node --input-type=module -e "import {existsSync,readFileSync} from 'node:fs'; const f='qa/v156/checkpoint-restart/report.json'; if(existsSync(f)) console.log(readFileSync(f,'utf8')); else console.log('Checkpoint report unavailable: step did not finish');"

      - name: Native late successful modal navigation
        run: node tests/v157-modal-command-navigation-browser.mjs

      - name: Native committed modal response loss and bounded replay
        run: node tests/v271-modal-transport-browser.mjs

      - name: Retain native navigation diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-navigation-${{ matrix.os }}
          path: |
            island/qa/v171/native-lobby-motion/report.json
            island/qa/v171/native-lobby-motion/*motion-samples.json
            island/qa/v171/native-lobby-motion/*.png
            island/qa/v194/movement-lost/report.json
            island/qa/v194/movement-lost/*motion-samples.json
            island/qa/v194/movement-lost/*.png
            island/qa/v173/native-farm-navigation/report.json
            island/qa/v173/native-farm-navigation/*.png
            island/qa/v148/native-lobby/report.json
            island/qa/v148/native-lobby/*.png
            island/qa/v196/gallery-backdrop/report.json
            island/qa/v196/gallery-backdrop/*.png
            island/qa/v156/checkpoint-restart/report.json
            island/qa/v156/checkpoint-restart/*.png
            island/qa/v157/modal-command-navigation/report.json
            island/qa/v157/modal-command-navigation/*.png
            island/qa/v271/modal-transport/**/report.json
            island/qa/v271/modal-transport/**/*-transport.jsonl
            island/qa/v271/modal-transport/report.json
          if-no-files-found: ignore
          retention-days: 3

  native-art:
    if: ((github.event_name != 'workflow_dispatch' || (inputs.check_scope != 'soil-diagnostics' && inputs.check_scope != 'recovery-input' && inputs.check_scope != 'social-pending' && inputs.check_scope != 'home-journal')) && (github.event_name != 'workflow_dispatch' || inputs.check_scope != 'frame-recovery')) && inputs.check_scope != 'resident-stall'
    name: ${{ matrix.os }} / native art
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-14, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: island
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - if: inputs.check_scope != 'soil-diagnostics'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Inspect deployment plan
        if: inputs.check_scope != 'soil-diagnostics'
        run: node tools/agent-deploy.mjs plan
      - name: Verify target platform
        if: inputs.check_scope != 'soil-diagnostics'
        run: node tools/agent-deploy.mjs doctor --python=python
      - name: Rebuild runtime from bundled dependencies
        if: inputs.check_scope != 'soil-diagnostics'
        run: node tools/agent-deploy.mjs setup --python=python --offline

      - name: Native steward portraits
        if: inputs.check_scope != 'soil-diagnostics'
        run: node tests/v153-portraits-browser.mjs

      - name: Native raster visibility without pixel changes
        run: node tests/v304-raster-visibility-browser.mjs

      - name: Native personal modal receipt and backdrop
        if: inputs.check_scope != 'soil-diagnostics'
        working-directory: island
        run: node tests/v294-personal-backdrop-browser.mjs
      - name: Native material item art
        if: inputs.check_scope != 'soil-diagnostics'
        run: node tests/v154-material-art-browser.mjs

      - name: Native recipe product art
        if: inputs.check_scope != 'soil-diagnostics'
        run: node tests/v155-product-art-browser.mjs

      - name: Native connected characters and dressed tools
        run: node tests/v180-rig-browser.mjs

      - name: Native seasonal terrain in home and meeting room
        if: inputs.check_scope != 'soil-diagnostics'
        run: node tests/v187-season-browser.mjs

      - name: Native clock-driven night lighting
        run: node tests/v200-night-lighting-browser.mjs

      - name: Native painting tools and canvas production
        env:
          HD_QA_WORK_JOURNAL: "1"
        run: node tests/v219-painting-tools-browser.mjs

      - name: Retain native character diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-character-${{ matrix.os }}
          path: |
            island/qa/v153/native-portraits/report.json
            island/qa/v153/native-portraits/*.png
            island/qa/v155/native-product-clips/report.json
            island/qa/v155/native-product-clips/pixel-checks.json
            island/qa/v155/native-product-clips/probe-input.json
            island/qa/v155/native-product-clips/failure-product-svg.png
            island/qa/v155/native-product-clips/*-c24_2-svg.png
            island/qa/v304/native-raster-visibility/report.json
            island/qa/v294/personal-backdrop/report.json
            island/qa/v294/personal-backdrop/*.png
            island/qa/v219/native-painting-tools/report.json
            island/qa/v219/native-painting-tools/work-progress.json
            island/qa/v219/native-painting-tools/*.sample.txt
            island/qa/v219/native-painting-tools/*.png
            island/qa/v180/native-rig/report.json
            island/qa/v180/native-rig/*.png
            island/qa/v187/native-seasons/report.json
            island/qa/v187/native-seasons/*.png
            island/qa/v200/native-night/report.json
            island/qa/v200/native-night/*.png
          if-no-files-found: ignore
          retention-days: 3

  native-homes:
    if: ((github.event_name != 'workflow_dispatch' || (inputs.check_scope != 'soil-diagnostics' && inputs.check_scope != 'recovery-input' && inputs.check_scope != 'social-pending' && inputs.check_scope != 'home-journal')) && (github.event_name != 'workflow_dispatch' || inputs.check_scope != 'frame-recovery')) && inputs.check_scope != 'resident-stall'
    name: ${{ matrix.os }} / native homes
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-14, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: island
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install isolated browser dependencies
        run: npm ci --ignore-scripts --registry=https://registry.npmjs.org
      - name: Native archive and mineral homes
        run: node tests/v197-research-homes-browser.mjs
      - name: Native archive journal across appearance switch
        run: node tests/v197-research-homes-lan-browser.mjs
      - name: Native music and tailor homes
        run: node tests/v198-creative-homes-browser.mjs
      - name: Native music journal across appearance switch
        run: node tests/v198-creative-homes-lan-browser.mjs
      - name: Native curator and steward homes
        run: node tests/v199-legacy-homes-browser.mjs
      - name: Native curator journal across appearance switch
        env:
          DEBUG: pw:browser
        run: node tests/v199-legacy-homes-lan-browser.mjs
      - name: Native steward journal and exchange entry
        env:
          HD_HOME_ID: '15'
        run: node tests/v199-legacy-homes-lan-browser.mjs
      - name: Retain native residence diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-residences-${{ matrix.os }}
          path: |
            island/qa/v197/native-homes/report.json
            island/qa/v197/native-homes/*.png
            island/qa/v197/native-home-lan-10/report.json
            island/qa/v197/native-home-lan-10/*.png
            island/qa/v198/native-homes/report.json
            island/qa/v198/native-homes/*.png
            island/qa/v198/native-home-lan-12/report.json
            island/qa/v198/native-home-lan-12/*.png
            island/qa/v199/native-homes/report.json
            island/qa/v199/native-homes/*.png
            island/qa/v199/native-home-lan-14/report.json
            island/qa/v199/native-home-lan-14/*.png
            island/qa/v199/native-home-lan-15/report.json
            island/qa/v199/native-home-lan-15/*.png
          if-no-files-found: ignore
          retention-days: 3

  native-gameplay:
    if: (inputs.check_scope != 'recovery-input' && inputs.check_scope != 'social-pending' && inputs.check_scope != 'home-journal' && inputs.check_scope != 'frame-recovery') && inputs.check_scope != 'resident-stall'
    name: ${{ matrix.os }} / ${{ inputs.check_scope == 'soil-diagnostics' && 'soil diagnostics' || 'native gameplay' }} / ${{ matrix.group }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-14, macos-15-intel]
        group: [reward, receipt, navigation, content]
    runs-on: ${{ matrix.os }}
    # Each isolated group keeps the original tests, clocks and one-hour job limit.
    timeout-minutes: 60
    defaults:
      run:
        working-directory: island
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install isolated browser dependencies
        run: npm ci --ignore-scripts --registry=https://registry.npmjs.org

      - name: Native pearl cup crafting and refresh
        if: matrix.group == 'reward' && inputs.check_scope != 'soil-diagnostics'
        env:
          HD_QA_WORK_JOURNAL: "1"
        run: node tests/v156-pearl-cup-craft-browser.mjs

      - name: Native queued reward confirmation
        if: matrix.group == 'reward'
        run: node tests/v168-reward-click-browser.mjs

      - name: Native low-frame-rate result and queued reward
        if: matrix.group == 'reward'
        env:
          HD_REWARD_INTENTS: claim
        run: node tests/v194-result-pacing-browser.mjs

      - name: Native independent receipt and close recovery
        if: matrix.group == 'receipt'
        run: node tests/v170-reward-drain-browser.mjs

      - name: Browser save waiter and authoritative craft ordering
        if: matrix.group == 'receipt'
        run: node tests/v204-save-waiter-browser.mjs

      - name: Native player farm intent after queued receipts
        if: matrix.group == 'receipt'
        run: node tests/v245-player-farm-intent-browser.mjs && node tests/v245-moment-day-browser.mjs

      - name: Native NPC farm intent after queued receipts
        if: matrix.group == 'receipt'
        run: node tests/v249-npc-farm-intent-browser.mjs

      - name: Native recovery return and visiting parties
        if: matrix.group == 'receipt'
        run: node tests/v205-recovery-return-browser.mjs && node tests/v205-visiting-party-browser.mjs

      - name: Native confirmed return after two cancelled navigations
        if: matrix.group == 'navigation'
        run: node tests/v214-recovery-link-browser.mjs

      - name: Native re-entry while recovery read is pending
        if: matrix.group == 'navigation'
        run: node tests/v216-recovery-wait-browser.mjs

      - name: Native recovery input through workshop modal dialogs
        if: matrix.group == 'navigation'
        run: node tests/v220-recovery-modal-browser.mjs && node tests/v268-recovery-background-browser.mjs

      - name: Native save-dialog recovery feedback and safe re-entry
        if: matrix.group == 'navigation'
        run: node tests/v223-recovery-feedback-browser.mjs

      - name: Native recovery controls follow in-flight reads
        if: matrix.group == 'navigation'
        run: node tests/v229-recovery-controls-browser.mjs

      - name: Native signed import and historical restore re-entry
        if: matrix.group == 'navigation'
        run: node tests/v226-save-replacement-browser.mjs

      - name: Native current catalog totals and preserved legacy achievements
        if: matrix.group == 'navigation'
        run: node tests/v221-catalog-counts-browser.mjs

      - name: Native recruitment error recovery and request identity
        if: matrix.group == 'content'
        run: node tests/v222-recruitment-errors-browser.mjs

      - name: Native recruitment progress behind accepted work
        if: matrix.group == 'content'
        run: node tests/v287-recruitment-progress-browser.mjs

      - name: Native confirmed publication and catalog synchronization
        if: matrix.group == 'content'
        run: node tests/v305-catalog-refresh-browser.mjs

      - name: Native custom products, artwork, reuse and cross-owner import
        if: matrix.group == 'content'
        run: node tests/v224-custom-content-browser.mjs

      - name: Native visitor timeout retains one settlement
        if: matrix.group == 'content'
        run: node tests/v303-visitor-timeout-browser.mjs

      - name: Native custom recipe resident preparation and reopen
        if: matrix.group == 'content'
        env:
          HD_QA_WORK_JOURNAL: "1"
        run: node tests/v227-custom-agent-browser.mjs

      - name: Native custom product shelves and visitor sales
        if: matrix.group == 'content'
        env:
          HD_QA_WORK_JOURNAL: "1"
        run: node tests/v228-custom-shops-browser.mjs

      - name: Native resident production to visitor purchase
        if: matrix.group == 'content'
        env:
          HD_QA_WORK_JOURNAL: "1"
          HD_QA_SHELF_FROM_PRODUCTION: "1"
          HD_QA_OUT: qa/v230/native-production-market
        run: node tests/v228-custom-shops-browser.mjs

      - name: Native night planning skips empty purposes
        if: matrix.group == 'content'
        run: node tests/v216-night-planning-browser.mjs

      - name: Retain isolated visitor timeout diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-visitor-timeout-${{ matrix.os }}-${{ matrix.group }}
          path: island/qa/v303/native-visitor-timeout/report.json
          if-no-files-found: ignore
          retention-days: 3

      - name: Retain isolated native soil-care diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-soil-care-${{ matrix.os }}-${{ matrix.group }}
          path: |
            island/qa/v156/native-pearl-cup-craft/report.json
            island/qa/v156/native-pearl-cup-craft/work-progress.json
            island/qa/v156/native-pearl-cup-craft/*.sample.txt
            island/qa/v156/native-pearl-cup-craft/*.png
            island/qa/v168/native-reward-click/report.json
            island/qa/v168/native-reward-click/*.png
            island/qa/v194/slow-result/report.json
            island/qa/v194/slow-result/*.png
            island/qa/v170/native-reward-drain/report.json
            island/qa/v170/native-reward-drain/*.png
            island/qa/v204/browser-save-waiter/report.json
            island/qa/v205/native-recovery-return/report.json
            island/qa/v205/native-recovery-return/*.png
            island/qa/v205/native-visiting-party/report.json
            island/qa/v205/native-visiting-party/*.png
            island/qa/v214/native-recovery-link/report.json
            island/qa/v214/native-recovery-link/*.png
            island/qa/v216/native-recovery-wait/report.json
            island/qa/v216/native-recovery-wait/*.png
            island/qa/v220/native-recovery-modal/report.json
            island/qa/v220/native-recovery-modal/*.png
            island/qa/v220/native-recovery-modal/*-input-failure.zip
            island/qa/v268/recovery-background/report.json
            island/qa/v268/recovery-background/*.png
            island/qa/v223/native-recovery-feedback/report.json
            island/qa/v223/native-recovery-feedback/*.png
            island/qa/v229/recovery-controls/report.json
            island/qa/v229/recovery-controls/*.png
            island/qa/v226/native-save-replacement/report.json
            island/qa/v226/native-save-replacement/*.png
            island/qa/v249/npc-farm-intent/report.json
            island/qa/v221/native-catalog-counts/report.json
            island/qa/v221/native-catalog-counts/*.png
            island/qa/v222/native-recruitment-errors/report.json
            island/qa/v222/native-recruitment-errors/*.png
            island/qa/v287/native-recruitment-progress/report.json
            island/qa/v287/native-recruitment-progress/*.png
            island/qa/v305/native-catalog-refresh/report.json
            island/qa/v305/native-catalog-refresh/*.png
            island/qa/v224/native-custom-content/report.json
            island/qa/v224/native-custom-content/*.png
            island/qa/v227/native-custom-agent/report.json
            island/qa/v227/native-custom-agent/work-progress.json
            island/qa/v227/native-custom-agent/*.sample.txt
            island/qa/v227/native-custom-agent/*.png
            island/qa/v228/native-custom-shops/report.json
            island/qa/v228/native-custom-shops/work-progress.json
            island/qa/v228/native-custom-shops/*.sample.txt
            island/qa/v228/native-custom-shops/*.png
            island/qa/v230/native-production-market/report.json
            island/qa/v230/native-production-market/work-progress.json
            island/qa/v230/native-production-market/*.sample.txt
            island/qa/v230/native-production-market/*.png
            island/qa/v216/native-night-planning/report.json
            island/qa/v216/native-night-planning/*.png
          if-no-files-found: ignore
          retention-days: 3

  # Intel runners reached the shared 45-minute job cap during the final scene
  # test. Run the same island simulations separately from receipt tests.
  native-island-simulation:
    if: (inputs.check_scope != 'recovery-input' && inputs.check_scope != 'social-pending' && inputs.check_scope != 'home-journal' && inputs.check_scope != 'frame-recovery') && inputs.check_scope != 'resident-stall'
    name: ${{ matrix.os }} / native island simulation
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-14, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: island
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install isolated browser dependencies
        run: npm ci --ignore-scripts --registry=https://registry.npmjs.org

      - name: Native island module download recovery
        run: node tests/v280-module-bootstrap-browser.mjs

      - name: Native granted player actions during unrelated receipts
        run: node tests/v281-player-action-browser.mjs

      - name: Native ferry clock ordering during background work
        run: node tests/v278-visitor-clock-browser.mjs

      - name: Native cash reporting and shared-style recovery
        if: inputs.check_scope != 'soil-diagnostics'
        run: node tests/v276-cash-browser.mjs

      - name: Native greenhouse soil care
        run: node tests/v159-soil-care-browser.mjs

      - name: Native views during an independent resident receipt
        run: node tests/v179-navigation-arrival-browser.mjs

      - name: Native NPC sow and water during independent receipts
        run: node tests/v179-npc-work-browser.mjs

      - name: Native resident social continuity after reload
        run: node tests/v221-resident-reentry-browser.mjs

      - name: Native dialogue while another receipt settles
        run: node tests/v262-social-pending-browser.mjs

      - name: Native interior return points and forest navigation
        if: inputs.check_scope != 'soil-diagnostics'
        run: node tests/v203-scene-return-browser.mjs

      - name: Retain isolated native island diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-island-simulation-${{ matrix.os }}
          path: |
            island/qa/v280/native-module-bootstrap/report.json
            island/qa/v281/native-player-action/report.json
            island/qa/v281/native-player-action/*.png
            island/qa/v278/native-visitor-clock/report.json
            island/qa/v276/native-cash/report.json
            island/qa/v276/native-cash/*.png
