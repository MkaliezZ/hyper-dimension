name: Island manual save diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: island-manual-save-${{ github.ref }}
  cancel-in-progress: false
jobs:
  intel-native:
    name: macos-15-intel / manual save and cash recovery
    runs-on: macos-15-intel
    timeout-minutes: 45
    defaults:
      run:
        working-directory: island
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install isolated browser dependencies
        run: npm ci --ignore-scripts --registry=https://registry.npmjs.org
      - name: Manual save feedback preserves acknowledgments and rejects failures
        run: node tests/v314-manual-save-feedback-browser.mjs
      - name: Native cash reporting and shared-style recovery
        run: node tests/v276-cash-browser.mjs
      - name: Retain fictional native evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-manual-save-macos-15-intel
          path: |
            island/qa/v314/manual-save-feedback/report.json
            island/qa/v276/native-cash/report.json
            island/qa/v276/native-cash/*.png
          if-no-files-found: error
          retention-days: 3
