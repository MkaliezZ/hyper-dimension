name: Island manual save diagnostics
on:
  workflow_dispatch:
    inputs:
      check_scope:
        description: Manual save, residents, rewards, project queue, artwork or soil care
        type: choice
        default: manual-save
        options: [manual-save, resident-busy-market, reward-drain, plan-queue, artwork-startup, soil-care]
permissions:
  contents: read
concurrency:
  group: island-manual-save-${{ github.ref }}-${{ inputs.check_scope || 'manual-save' }}
  cancel-in-progress: false
jobs:
  intel-native:
    name: ${{ inputs.check_scope == 'soil-care' && 'macos-15-intel / native greenhouse pause and full growth' || inputs.check_scope == 'artwork-startup' && 'windows-2022 / slow artwork startup and cash recovery' || inputs.check_scope == 'plan-queue' && 'windows-2022 / manual project queue and resident preparation' || inputs.check_scope == 'resident-busy-market' && 'windows-2022 / resident busy and production market' || inputs.check_scope == 'reward-drain' && 'macos-15-intel / independent receipt pause recovery' || 'macos-15-intel / manual save and cash recovery' }}
    runs-on: ${{ (inputs.check_scope == 'resident-busy-market' || inputs.check_scope == 'plan-queue' || inputs.check_scope == 'artwork-startup') && 'windows-2022' || 'macos-15-intel' }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: island
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install isolated browser dependencies
        run: npm ci --ignore-scripts --registry=https://registry.npmjs.org
      - name: Manual save feedback preserves acknowledgments and rejects failures
        run: node tests/v314-manual-save-feedback-browser.mjs
      - name: Native cash reporting and shared-style recovery
        if: inputs.check_scope == 'manual-save'
        run: node tests/v276-cash-browser.mjs
      - name: Resident begin recovers identical identity-busy replies
        if: inputs.check_scope == 'resident-busy-market'
        run: node tests/v315-resident-lan-busy-browser.mjs
      - name: Native resident production to visitor purchase
        if: inputs.check_scope == 'resident-busy-market'
        env:
          HD_QA_WORK_JOURNAL: '1'
          HD_QA_SHELF_FROM_PRODUCTION: '1'
          HD_QA_OUT: qa/v230/native-production-market
        run: node tests/v228-custom-shops-browser.mjs
      - name: Native continued Sokoban board and cancellation
        if: inputs.check_scope == 'reward-drain'
        env:
          HD_QA_DRAIN_PAUSE: '1'
          HD_QA_DRAIN_CASE: origami:cancel
          HD_QA_OUT: qa/v316/forced-reward-drain
        run: node tests/v170-reward-drain-browser.mjs
      - name: Native independent receipt and close recovery
        if: inputs.check_scope == 'reward-drain'
        run: node tests/v170-reward-drain-browser.mjs
      - name: Manual plan waits for active receipt and passes unstarted work
        if: inputs.check_scope == 'plan-queue'
        run: node tests/v317-plan-queue-browser.mjs
      - name: Native custom recipe resident preparation and reopen
        if: inputs.check_scope == 'plan-queue'
        env:
          HD_QA_WORK_JOURNAL: '1'
        run: node tests/v227-custom-agent-browser.mjs
      - name: Bounded image decode and seasonal loading rules
        if: inputs.check_scope == 'artwork-startup'
        run: node --test tests/v318-artwork-decode.test.mjs tests/v176-season-artwork-loading.test.mjs
      - name: Native slow-renderer cash and shared-style recovery
        if: inputs.check_scope == 'artwork-startup'
        env:
          HD_QA_CDP_CPU: '2'
          HD_QA_OUT: qa/v318/native-cash-cpu2
        run: node tests/v276-cash-browser.mjs
      - name: Native greenhouse crafting and complete crop growth
        if: inputs.check_scope == 'soil-care'
        run: node tests/v159-soil-care-browser.mjs
      - name: Native greenhouse pause continuation and complete crop growth
        if: inputs.check_scope == 'soil-care'
        env:
          HD_QA_FORCE_SOIL_PAUSE: '1'
          HD_QA_OUT: qa/v319/native-soil-pause
        run: node tests/v159-soil-care-browser.mjs
      - name: Retain fictional native evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-manual-save-${{ inputs.check_scope == 'soil-care' && 'macos-15-intel-soil-care' || inputs.check_scope == 'artwork-startup' && 'windows-2022-artwork-startup' || inputs.check_scope == 'plan-queue' && 'windows-2022-plan-queue' || inputs.check_scope == 'resident-busy-market' && 'windows-2022-busy' || inputs.check_scope == 'reward-drain' && 'macos-15-intel-reward-drain' || 'macos-15-intel' }}
          path: |
            island/qa/v314/manual-save-feedback/report.json
            island/qa/v276/native-cash/report.json
            island/qa/v276/native-cash/*.png
            island/qa/v315/native-resident-lan-busy/report.json
            island/qa/v230/native-production-market/report.json
            island/qa/v230/native-production-market/work-progress.json
            island/qa/v230/native-production-market/*.png
            island/qa/v170/native-reward-drain/report.json
            island/qa/v170/native-reward-drain/*.png
            island/qa/v316/forced-reward-drain/report.json
            island/qa/v316/forced-reward-drain/*.png
            island/qa/v317/native-plan-queue/report.json
            island/qa/v317/native-plan-queue/*.png
            island/qa/v227/native-custom-agent/report.json
            island/qa/v227/native-custom-agent/work-progress.json
            island/qa/v227/native-custom-agent/*.png
            island/qa/v318/native-cash-cpu2/report.json
            island/qa/v318/native-cash-cpu2/*.png
            island/qa/v159/native-soil-care/report.json
            island/qa/v159/native-soil-care/*.png
            island/qa/v319/native-soil-pause/report.json
            island/qa/v319/native-soil-pause/*.png
          if-no-files-found: error
          retention-days: 3
