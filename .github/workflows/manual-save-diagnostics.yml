name: Island player-start timing diagnostic
"on":
  workflow_dispatch:
    inputs:
      check_scope:
        description: Read-only timing diagnosis on the isolated branch; no acceptance claim
        type: choice
        options: [manual-save]
        default: manual-save
permissions:
  contents: read
concurrency:
  group: island-player-start-diagnostic-${{ github.ref }}
  cancel-in-progress: false
jobs:
  intel-player-timing:
    name: macos-15-intel / original player gates with read-only save timings
    runs-on: macos-15-intel
    timeout-minutes: 20
    defaults:
      run:
        working-directory: island
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install isolated browser dependencies
        run: npm ci --ignore-scripts --registry=https://registry.npmjs.org
      - name: Prepare original fixture with bounded read-only save timing observations
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,json,hashlib

          root=Path.cwd();q=root/'qa/diagnostics-player-start';q.mkdir(parents=True,exist_ok=False)
          source=(root/'tests/v281-player-action-browser.mjs').read_text('utf-8')
          original=source
          def module(match):
           name=match[1]
           if name.startswith('.'):
            target=(root/'tests'/name).resolve().as_uri()
           elif name=='playwright-core':target=(root/'node_modules/playwright-core/index.mjs').as_uri()
           else:return match[0]
           return "from '"+target+"'"
          source=re.sub(r"from '([^']+)'",module,source)
          old="const root=path.resolve(import.meta.dirname,'..'),out="
          new="const root="+json.dumps(str(root))+",out="
          assert source.count(old)==1;source=source.replace(old,new)
          old=" let release,held=false;const gate=new Promise(r=>release=r);"
          new=old+"\n const diagnostic=await context.newCDPSession(page);await diagnostic.send('Emulation.setCPUThrottlingRate',{rate:1});row.diagnosticCpuThrottleRate=4;\n await context.route('**/src/saveClient.js',async route=>{const response=await route.fetch();let body=await response.text();const add=(old,next)=>{assert.equal(body.split(old).length-1,1,old);body=body.replace(old,next)};add(' function cache(r){',' function cache(r){globalThis.__saveTiming?.(\"cache-enqueue\",r);');add('   if(publication)await publication;','   globalThis.__saveTiming?.(\"cache-run\",r);if(publication)await publication;');add('await journal.encodeSnapshot(snapshotState,','await (globalThis.__saveTiming?.(\"snapshot-start\",r),journal.encodeSnapshot(snapshotState,');add('r.capturing=false;}});','r.capturing=false;}}));globalThis.__saveTiming?.(\"snapshot-end\",r);');add(' async function actionNow(theme,input,prepareInput,options){',' async function actionNow(theme,input,prepareInput,options){globalThis.__saveTiming?.(\"action-now-\"+input.kind+\"-\"+input.operation,record(theme));');add(' async function publishAcknowledged(r,doc,base,path,retireKeys){',' async function publishAcknowledged(r,doc,base,path,retireKeys){globalThis.__saveTiming?.(\"publication-start\",r);');add('  onRemoteState(r.theme,r.state);return result;','  onRemoteState(r.theme,r.state);globalThis.__saveTiming?.(\"publication-end\",r);return result;');await route.fulfill({response,body});});"
          assert source.count(old)==1;source=source.replace(old,new)
          old="window.__playerActionQA={"
          new="globalThis.__saveTimingRows=[];globalThis.__saveTiming=(phase,r)=>{globalThis.__saveTimingRows.push({at:performance.now(),phase,generation:r.generation,status:r.status,dirty:r.dirty,capturing:!!r.capturing});if(globalThis.__saveTimingRows.length>300)globalThis.__saveTimingRows.shift();};\n"+old
          assert source.count(old)==1;source=source.replace(old,new)
          old="holdError:this.holdError||null,active:"
          new="holdError:this.holdError||null,diagnosticSaveTiming:globalThis.__saveTimingRows,active:"
          assert source.count(old)==1;source=source.replace(old,new)
          old="row.realForeignCommandQueuedAtGrantedAnimation=true;"
          new=old+"row.diagnosticSaveTiming=await page.evaluate(()=>globalThis.__saveTimingRows);"
          assert source.count(old)==1;source=source.replace(old,new)
          target=q/'player-start-timing.mjs';assert not target.exists();target.write_text(source,encoding='utf-8')
          (q/'player-start-timing-preparation.json').write_text(json.dumps({'originalFixtureSHA256':hashlib.sha256(original.encode()).hexdigest(),'diagnosticOnly':True,'acceptanceClaim':False,'cpuRate':1,'readOnlyBoundedSaveTimingsAdded':True,'originalSetupNetworkCompletionAndEconomyAssertionsRetained':True,'sourceArchiveOrUserDataChanged':False,'wholeGoalComplete':False},indent=2)+'\n',encoding='utf-8')
          print('Prepared normal-host read-only save timing observation with original action gates retained; no acceptance result yet.')
          PY
      - name: Diagnose original setup, overlap, authority and reopen gates
        timeout-minutes: 4
        env:
          DEEPSEEK_API_KEY: ''
          HD_QA_OUT: qa/diagnostics-player-start/result
        run: |
          node --check qa/diagnostics-player-start/player-start-timing.mjs
          node qa/diagnostics-player-start/player-start-timing.mjs
      - name: Retain fictional diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-player-start-save-timings-macos-15-intel
          path: |
            island/qa/diagnostics-player-start/player-start-timing-preparation.json
            island/qa/diagnostics-player-start/result/report.json
            island/qa/diagnostics-player-start/result/*-failure.png
            island/qa/diagnostics-player-start/result/*-confirmed.png
          if-no-files-found: error
          retention-days: 3
