name: Island manual save diagnostics
on:
  workflow_dispatch:
    inputs:
      check_scope:
        description: Manual save confirmation or resident identity-busy production market
        type: choice
        default: manual-save
        options: [manual-save, resident-busy-market]
permissions:
  contents: read
concurrency:
  group: island-manual-save-${{ github.ref }}-${{ inputs.check_scope || 'manual-save' }}
  cancel-in-progress: false
jobs:
  intel-native:
    name: ${{ inputs.check_scope == 'resident-busy-market' && 'windows-2022 / resident busy and production market' || 'macos-15-intel / manual save and cash recovery' }}
    runs-on: ${{ inputs.check_scope == 'resident-busy-market' && 'windows-2022' || 'macos-15-intel' }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: island
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install isolated browser dependencies
        run: npm ci --ignore-scripts --registry=https://registry.npmjs.org
      - name: Manual save feedback preserves acknowledgments and rejects failures
        run: node tests/v314-manual-save-feedback-browser.mjs
      - name: Native cash reporting and shared-style recovery
        if: inputs.check_scope != 'resident-busy-market'
        run: node tests/v276-cash-browser.mjs
      - name: Resident begin recovers identical identity-busy replies
        if: inputs.check_scope == 'resident-busy-market'
        run: node tests/v315-resident-lan-busy-browser.mjs
      - name: Native resident production to visitor purchase
        if: inputs.check_scope == 'resident-busy-market'
        env:
          HD_QA_WORK_JOURNAL: '1'
          HD_QA_SHELF_FROM_PRODUCTION: '1'
          HD_QA_OUT: qa/v230/native-production-market
        run: node tests/v228-custom-shops-browser.mjs
      - name: Retain fictional native evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-manual-save-${{ inputs.check_scope == 'resident-busy-market' && 'windows-2022-busy' || 'macos-15-intel' }}
          path: |
            island/qa/v314/manual-save-feedback/report.json
            island/qa/v276/native-cash/report.json
            island/qa/v276/native-cash/*.png
            island/qa/v315/native-resident-lan-busy/report.json
            island/qa/v230/native-production-market/report.json
            island/qa/v230/native-production-market/work-progress.json
            island/qa/v230/native-production-market/*.png
          if-no-files-found: error
          retention-days: 3
