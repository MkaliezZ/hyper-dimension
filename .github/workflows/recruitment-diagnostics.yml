name: Island recruitment diagnostics
on:
  workflow_dispatch:
    inputs:
      test_case:
        description: Keep the original native assertions and budgets; use the real pause/resume button
        type: choice
        options: [recruitment, recruitment-errors, recovery-return, task-chain-reload, player-action, custom-content, pearl-cup, save-replacement, custom-shops, field-finish]
        default: recruitment
      profiler:
        description: Sample only the owned native fixture page CPU stack
        type: boolean
        default: false
      backdrop_candidate:
        description: Evaluate a pending-recruitment or static-shelf backdrop candidate without changing the game source
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: island-recruitment-diagnostics-${{ github.ref }}
  cancel-in-progress: false
jobs:
  recruitment-progress:
    name: ${{ inputs.test_case == 'field-finish' && 'windows-2022 / NPC mining completion recovery' || inputs.test_case == 'task-chain-reload' && 'macos-15-intel / task chain reload journal' || inputs.test_case == 'recovery-return' && 'macos-14 / recovery return source retry' || inputs.test_case == 'recruitment-errors' && 'windows-2022 / recruitment status recovery' || inputs.test_case == 'custom-shops' && 'windows-2022 / custom shelf artwork' || inputs.test_case == 'custom-content' && 'macos-14 / catalog synchronization' || inputs.test_case == 'save-replacement' && 'macos-15-intel / save replacement' || inputs.test_case == 'pearl-cup' && 'macos-15-intel / pearl cup pause' || 'macos-15-intel / recruitment scheduling' }}
    runs-on: ${{ (inputs.test_case == 'custom-shops' || inputs.test_case == 'recruitment-errors' || inputs.test_case == 'field-finish') && 'windows-2022' || (inputs.test_case == 'custom-content' || inputs.test_case == 'recovery-return') && 'macos-14' || 'macos-15-intel' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install isolated browser dependencies
        working-directory: island
        run: npm ci --ignore-scripts --registry=https://registry.npmjs.org
      - name: Observe the original native interaction deadlines
        if: inputs.test_case != 'custom-shops' && inputs.test_case != 'field-finish' && inputs.test_case != 'recruitment-errors' && inputs.test_case != 'recovery-return' && inputs.test_case != 'task-chain-reload'
        env:
          HD_QA_RECRUIT_BACKDROP: ${{ inputs.backdrop_candidate && '1' || '0' }}
          HD_QA_NATIVE_CASE: ${{ inputs.test_case || 'recruitment' }}
          HD_QA_PEARL_PAUSE: ${{ inputs.test_case == 'pearl-cup' && '1' || '0' }}
          HD_QA_HOLD_POST_CHECKPOINT: ${{ inputs.test_case == 'save-replacement' && '1' || '0' }}
          HD_QA_NATIVE_PROFILE: ${{ inputs.profiler && '1' || '0' }}
        run: node .github/diagnostics/recruitment-progress.mjs
      - name: Observe original recruitment status error recovery deadlines
        if: inputs.test_case == 'recruitment-errors'
        run: node .github/diagnostics/recruitment-errors.mjs
      - name: Verify bounded source GET retry on real connection resets
        if: inputs.test_case == 'recovery-return'
        run: node .github/diagnostics/recovery-return.mjs --check-transport
      - name: Native recovery return with bounded source GET retry
        if: inputs.test_case == 'recovery-return'
        run: node .github/diagnostics/recovery-return.mjs
      - name: Observe task chain reload conflict without changing native work budgets
        if: inputs.test_case == 'task-chain-reload'
        run: node .github/diagnostics/task-chain-reload.mjs
      - name: Observe original custom shelf image loading and native CPU
        if: inputs.test_case == 'custom-shops'
        run: node .github/diagnostics/shelf-artwork.mjs
      - name: Compare static shelf backdrop under the original native assertions
        if: always() && inputs.test_case == 'custom-shops' && inputs.backdrop_candidate
        env:
          HD_QA_SHELF_STATIC_BACKDROP: '1'
          HD_QA_OUT: island/qa/v322/native-shelf-static-candidate
        run: node .github/diagnostics/shelf-artwork.mjs
      - name: Reobserve the original shelf backdrop after the candidate
        if: always() && inputs.test_case == 'custom-shops' && inputs.backdrop_candidate
        env:
          HD_QA_OUT: island/qa/v322/native-shelf-baseline-after
        run: node .github/diagnostics/shelf-artwork.mjs
      - name: Native completion clock boundary rules
        if: inputs.test_case == 'field-finish'
        run: node --test .github/diagnostics/native-finish-clock.test.mjs
      - name: Native confirmed mining finish after the original fetch expires
        if: inputs.test_case == 'field-finish'
        working-directory: island
        run: node tests/v321-field-finish-timeout-browser.mjs
      - name: Native custom shelves, retained backdrop and world resume
        if: inputs.test_case == 'field-finish'
        working-directory: island
        env:
          HD_QA_WORK_JOURNAL: '1'
        run: node tests/v322-shelf-backdrop-browser.mjs
      - name: Native shelf sales with one actual expired mining completion
        if: inputs.test_case == 'field-finish'
        run: node .github/diagnostics/field-finish-market.mjs
      - name: Retain owned native scheduling observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-scheduling-${{ inputs.test_case || 'recruitment' }}-${{ (inputs.test_case == 'custom-shops' || inputs.test_case == 'recruitment-errors' || inputs.test_case == 'field-finish') && 'windows-2022' || (inputs.test_case == 'custom-content' || inputs.test_case == 'recovery-return') && 'macos-14' || 'macos-15-intel' }}
          path: |
            island/qa/v321/native-field-finish-timeout/report.json
            island/qa/v321/native-field-finish-market/report.json
            island/qa/v321/native-field-finish-market/fault-injection.json
            island/qa/v321/native-field-finish-market/work-progress.json
            island/qa/v321/native-field-finish-market/*.png
            island/qa/v213/native-task-chains/report.json
            island/qa/v213/native-task-chains/work-progress.json
            island/qa/v213/native-task-chains/reload-observation-*.json
            island/qa/v213/native-task-chains/*.png
            island/qa/v205/native-recovery-return/report.json
            island/qa/v205/native-recovery-return/*.png
            island/qa/v205/native-visiting-party/report.json
            island/qa/v205/native-visiting-party/*.png
            island/qa/v222/native-recruitment-errors/report.json
            island/qa/v222/native-recruitment-errors/status-observations-*.json
            island/qa/v222/native-recruitment-errors/*.png
            island/qa/v287/native-recruitment-progress/report.json
            island/qa/v287/native-recruitment-progress/scheduling-journal-*.json
            island/qa/v287/native-recruitment-progress/*.png
            island/qa/v287/native-recruitment-progress/*.cpuprofile
            island/qa/v322/native-shelf-backdrop/*.json
            island/qa/v322/native-shelf-backdrop/*.png
            island/qa/v322/native-shelf-baseline-after/*.json
            island/qa/v322/native-shelf-baseline-after/*.png
            island/qa/v322/native-shelf-baseline-after/*.cpuprofile
            island/qa/v322/native-shelf-static-candidate/report.json
            island/qa/v322/native-shelf-static-candidate/work-progress.json
            island/qa/v322/native-shelf-static-candidate/*.json
            island/qa/v322/native-shelf-static-candidate/*.png
            island/qa/v322/native-shelf-static-candidate/*.cpuprofile
            island/qa/v228/native-custom-shops/report.json
            island/qa/v228/native-custom-shops/artwork-observations-*.json
            island/qa/v228/native-custom-shops/artwork-profile-*.cpuprofile
            island/qa/v228/native-custom-shops/work-progress.json
            island/qa/v228/native-custom-shops/scheduling-journal-*.json
            island/qa/v228/native-custom-shops/*.png
            island/qa/v228/native-custom-shops/*.cpuprofile
            island/qa/v281/native-player-action/report.json
            island/qa/v281/native-player-action/scheduling-journal-*.json
            island/qa/v281/native-player-action/*.png
            island/qa/v281/native-player-action/*.cpuprofile
            island/qa/v226/native-save-replacement/report.json
            island/qa/v226/native-save-replacement/scheduling-journal-*.json
            island/qa/v226/native-save-replacement/*.png
            island/qa/v156/native-pearl-cup-craft/report.json
            island/qa/v156/native-pearl-cup-craft/work-progress.json
            island/qa/v156/native-pearl-cup-craft/scheduling-journal-*.json
            island/qa/v156/native-pearl-cup-craft/*.png
            island/qa/v156/native-pearl-cup-craft/*.cpuprofile
            island/qa/v224/native-custom-content/report.json
            island/qa/v224/native-custom-content/scheduling-journal-*.json
            island/qa/v224/native-custom-content/*.png
            island/qa/v224/native-custom-content/*.cpuprofile
          if-no-files-found: error
          retention-days: 3
