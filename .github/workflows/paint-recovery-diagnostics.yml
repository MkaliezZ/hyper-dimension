name: Island paint recovery diagnostics
on:
  workflow_dispatch:
    inputs:
      check_scope:
        description: Isolated canonical receipt boundary qualification
        type: choice
        default: paint-recovery
        options: [paint-recovery, painting-tools]
permissions:
  contents: read
concurrency:
  group: save-receipt-boundary-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-boundary:
    name: ${{ matrix.os }} / receipt boundary / observer ${{ matrix.delay }}ms
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-15-intel]
        delay: [0, 3000]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: island
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install isolated browser dependencies
        run: npm ci --ignore-scripts --registry=https://registry.npmjs.org
      - name: Actual player animation with an accepted withheld foreign receipt
        env:
          HD_QA_ACTION_OBSERVER_DELAY_MS: ${{ matrix.delay }}
        run: node ../diagnostics/save-receipt-boundary-v361.mjs
      - name: Retain actual authority and unchanged deadline evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: receipt-boundary-${{ matrix.os }}-${{ matrix.delay }}
          path: |
            island/qa/v281/native-player-action/report.json
            island/qa/v281/native-player-action/*.png
          if-no-files-found: error
          retention-days: 3
