<body data-theme="__DEFAULT_THEME__"><div id="app"><main class="game-column"><div class="viewport" id="viewport"><canvas id="game" aria-label="可交互的小岛游戏画面"></canvas><div class="map-badge" id="mapBadge">拖拽地图 · 滚轮缩放 · 点击目的地寻路</div><div id="toast" class="toast hidden"></div></div></main>
<header class="topbar hud-panel"><div class="brand"><span class="brand-mark">✦</span><div><b>晨光岛</b><small>HYPER DIMENSION <button id="worldEnvironmentStatus" class="environment-status" aria-label="查看世界昼夜与四季">春 · 10:30</button></small><button class="scene-button hidden" id="sceneBack">← 返回小岛</button></div></div><div class="top-center"><span class="weather">☀ 第 <b id="day">1</b> 天</span><span class="money">✦ <b id="coins">120</b></span></div></header>

<button id="mobileJournal" aria-label="打开岛屿手账">岛屿手账</button><aside class="quest-panel hud-panel"><div class="section-title">岛屿手账 <span id="sceneLabel">小岛</span><button id="questToggle" aria-label="收起手账">−</button></div><div id="questList" class="quest-list"></div><div class="side-footer"><span id="saveStatus">正在读取存档</span><span>建筑 <b id="builtCount">2</b>/25 · 活动 <b id="activityCount">0</b></span></div></aside>
