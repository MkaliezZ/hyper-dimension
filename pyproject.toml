[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hyper-dimension"
version = "0.1.0"
description = "Hyper Dimension teacher-first education platform"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "jsonschema>=4.23,<5",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
pdf = [
  "pymupdf>=1.26,<2",
]
dev = [
  "pytest>=8,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hyper_dimension = ["schemas/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
