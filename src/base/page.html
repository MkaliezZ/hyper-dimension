<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>base · 我的伴学</title>
<style>body{font:17px/1.7 system-ui;background:#f3f6f2;color:#18342b;margin:0}main{max-width:800px;margin:45px auto;padding:24px}section,article{background:white;border:1px solid #dce5dc;border-radius:14px;padding:24px;margin:18px 0}h1{font-size:32px}label{display:block}input,textarea,button{font:inherit;box-sizing:border-box;padding:10px;border:1px solid #aabdaf;border-radius:7px}input,textarea{width:100%;margin:8px 0}button{background:#205c43;color:white;cursor:pointer;margin-top:8px}textarea{min-height:110px}p{white-space:pre-wrap}small{color:#53665b}a{color:#205c43}#message{color:#8c3c17;white-space:pre-wrap}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style>
<main><small>base / 独立开发的教育伴学</small><h1 id="title">我的伴学</h1><div id="message" role="status"></div><div id="content"></div></main>
<script>
const content=document.getElementById('content'),message=document.getElementById('message');
function el(tag,text,parent=content){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;parent.append(e);return e}
async function api(url,body){const r=await fetch(url,body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await r.json();if(!r.ok)throw Error(data.error||'请求失败');return data}
function guard(fn){return async()=>{message.textContent='';try{await fn()}catch(e){message.textContent=e.message}}}
const token=location.pathname.startsWith('/learn/')?location.pathname.split('/')[2]:null;
async function show(){content.replaceChildren();if(token){await learner();return}try{await manager()}catch(e){if(e.message==='请先登录维护者入口')login();else message.textContent=e.message}}
function login(){content.replaceChildren();const box=el('section');el('h2','维护者登录',box);el('p','打开启动终端提示的 owner-token.txt，复制管理口令（默认 data/base/owner-token.txt）。',box);const input=el('input',undefined,box);input.type='password';input.setAttribute('aria-label','管理口令');const button=el('button','登录',box);button.onclick=guard(async()=>{await api('/api/login',{token:input.value});await show()})}
async function manager(){const data=await api('/api/manage');document.getElementById('title').textContent=data.preview.name;const box=el('section');el('h2','预览当前活动',box);el('h3',data.preview.activity_title,box);el('p',data.preview.material,box);el('p',data.preview.instructions,box);el('small','评价依据：'+data.preview.criteria,box);el('p','活动下一步：'+data.preview.next_step,box);const createKey=(globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36));const input=el('input',undefined,box);input.placeholder='学习者称呼（同名可分别建档）';input.setAttribute('aria-label','学习者称呼');el('button','确认内容，创建学习链接',box).onclick=guard(async()=>{await api('/api/tasks',{learner:input.value,request_key:createKey});await show()});const tasks=el('section');el('h2','已创建的活动',tasks);for(const t of data.tasks){const p=el('p',t.learner+' · '+t.created.slice(0,16)+' ',tasks);const a=el('a','打开学习链接',p);a.href='/learn/'+encodeURIComponent(t.token)}
const records=el('section');el('h2','提交与反馈',records);if(!data.submissions.length)el('p','还没有提交。先打开学习链接完成一次活动。',records);for(const s of data.submissions){const card=el('article',undefined,records);const t=data.tasks.find(t=>t.id===s.task_id);el('h3',(t?t.learner:'学习者')+' · '+s.created.slice(0,16),card);el('p',s.answer,card);showEvaluation(s.evaluation,card);const scoreInputs=[];for(const rule of (t?.rubric||[])){const label=el('label',rule.label+'（满分 '+rule.max_score+'）',card);const field=el('input',undefined,label);field.type='number';field.min='0';field.max=String(rule.max_score);field.step='any';field.setAttribute('aria-label','得分：'+rule.label);field.placeholder='可选；如录入须填全维度';scoreInputs.push({rule,field})}const comment=el('textarea',undefined,card);comment.placeholder='依据活动要求给出具体反馈';comment.setAttribute('aria-label','反馈');const next=el('input',undefined,card);next.placeholder='下一步行动';next.setAttribute('aria-label','下一步行动');el('button','保存反馈',card).onclick=guard(async()=>{const filled=scoreInputs.filter(v=>v.field.value!=='');if(filled.length&&filled.length!==scoreInputs.length)throw Error('分项得分请填写全部维度，或全部留空');const body={comment:comment.value,next_step:next.value};if(filled.length)body.scores=filled.map(v=>({label:v.rule.label,score:Number(v.field.value)}));await api('/api/feedback/'+s.id,body);await show()})}el('button','退出维护者登录').onclick=guard(async()=>{await api('/api/logout',{});await show()})}
async function learner(){const data=await api('/api/learn/'+encodeURIComponent(token));document.getElementById('title').textContent=data.activity.name;const box=el('section');el('small','学习者：'+data.learner,box);el('h2',data.activity.activity_title,box);el('p',data.activity.material,box);el('p',data.activity.instructions,box);el('p','评价依据：'+data.activity.criteria,box);el('p','活动下一步：'+data.activity.next_step,box);const answer=el('textarea',undefined,box);answer.setAttribute('aria-label','我的提交');answer.placeholder='在这里写下答案或作品说明';let key=(globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36));const button=el('button','提交',box);button.onclick=guard(async()=>{button.disabled=true;try{await api('/api/learn/'+encodeURIComponent(token),{answer:answer.value,request_key:key});await show()}finally{button.disabled=false}});el('button','刷新反馈',box).onclick=guard(show);for(const s of data.submissions){const card=el('section');el('small',s.created,card);el('p',s.answer,card);el('h3',s.evaluation.status==='pending'?'等待反馈':'反馈',card);showEvaluation(s.evaluation,card);el('p','下一步：'+s.evaluation.next_step,card)}}
function showEvaluation(evaluation,parent){el('p',evaluation.comment,parent);if(evaluation.scores){for(const row of evaluation.scores)el('p',row.label+'：'+row.score+' / '+row.max_score,parent);el('strong','总分：'+evaluation.total+' / '+evaluation.max_total,parent)}}
guard(show)();
</script></html>
